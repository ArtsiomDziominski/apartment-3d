<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D-модель квартиры: обзор сверху и прогулка по комнатам.">
<title>Квартира в 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap">
<style>
[hidden]{display:none!important}
.back{display:inline-block;margin:0 0 3px;font:500 12px/1.3 var(--f-ui);color:var(--muted);text-decoration:none}.back:hover{color:var(--accent)}
/* Layout: full-bleed 3D stage; a title card floats top-left, the control dock runs along the bottom edge */
:root{
  --bg:#ECE6DD; --scene:#E4DDD2; --panel:rgba(252,249,244,.93);
  --fg:#2E2C29; --muted:#6B665E; --accent:#B5562F; --accent-fg:#FFF8F2; --line:rgba(46,44,41,.14);
  --shadow:rgba(46,44,41,.10);
  --f-display:'Montserrat','Segoe UI',Arial,sans-serif; --f-ui:'Inter','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1C1B19;--scene:#262420;--panel:rgba(37,35,32,.92);--fg:#F2EDE6;--muted:#B4AB9E;--accent:#E3804F;--accent-fg:#1C1B19;--line:rgba(242,237,230,.16);--shadow:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1B19;--scene:#262420;--panel:rgba(37,35,32,.92);--fg:#F2EDE6;--muted:#B4AB9E;--accent:#E3804F;--accent-fg:#1C1B19;--line:rgba(242,237,230,.16);--shadow:rgba(0,0,0,.35);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.card{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(380px,calc(100% - 32px));box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 24px var(--shadow)}
.card h1{margin:0;font:700 16px/1.25 var(--f-display);letter-spacing:.01em;text-wrap:balance}
.card .view{margin:3px 0 0;font:600 13px/1.35 var(--f-ui);color:var(--accent)}
.card .hint{margin:4px 0 0;font:400 12px/1.45 var(--f-ui);color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dock > *{pointer-events:auto}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 16px var(--shadow)}
.seg button{border:0;background:transparent;color:var(--fg);font:600 13px/1 var(--f-ui);padding:8px 15px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.views{display:flex;gap:4px;overflow-x:auto;max-width:100%;box-sizing:border-box;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px;scrollbar-width:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 16px var(--shadow)}
.views::-webkit-scrollbar{display:none}
.views button{flex:none;border:1px solid transparent;background:transparent;color:var(--fg);font:500 13px/1 var(--f-ui);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.views button:hover{border-color:var(--line)}
.views button[aria-current="true"]{border-color:var(--accent);color:var(--accent)}
.tool{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px/1 var(--f-ui);padding:9px 14px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 16px var(--shadow)}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
a.tool{text-decoration:none;display:inline-block}
a.tool:hover{border-color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool[hidden]{display:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.rl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:600 12px/1 var(--f-display);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;white-space:nowrap}
.cap{display:none}
body.shot .card,body.shot .dock{display:none}
body.shot .cap{display:block;position:fixed;left:26px;top:22px;background:var(--panel);color:var(--fg);border-radius:10px;padding:9px 18px;font:700 24px/1.25 var(--f-display);box-shadow:0 4px 16px var(--shadow)}
body.shot .cap small{display:block;font:500 16px/1.4 var(--f-ui);color:var(--muted);margin-top:2px}
@media (max-width:560px){.card{padding:8px 12px}.card .hint{font-size:11.5px}.seg button{padding:8px 12px}}
</style>
</head>
<body>

<div id="stage"></div>
<div id="labels" aria-hidden="true"></div>
<header class="card">
  <a class="back" href="./">← Меню</a>
  <h1>Квартира в 3D</h1>
  <p class="view" id="viewName">Обзор сверху</p>
  <p class="hint" id="hint"></p>
</header>
<nav class="dock" aria-label="Управление видом">
  <div class="seg" role="group" aria-label="Режим">
    <button id="mOver" type="button" aria-pressed="true">Обзор</button>
    <button id="mWalk" type="button" aria-pressed="false">Прогулка</button>
  </div>
  <div class="views" id="views" role="group" aria-label="Точки обзора"></div>
  <button class="tool" id="cutBtn" type="button" aria-pressed="true">Срез стен</button>
  <a class="tool" href="plan.html">План</a>
</nav>
<div class="cap" id="cap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const SHOT = location.hash.indexOf('#shot-') === 0;
if (SHOT) document.body.classList.add('shot');
const $ = id => document.getElementById(id);
const vw=()=>Math.max(1,window.innerWidth||document.documentElement.clientWidth||1), vh=()=>Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
const CEIL = 2.7, CUT = 1.2, EYE = 1.6, PR = 0.2;
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;

let R;
try {
  R = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:SHOT});
} catch (e) {
  $('viewName').textContent = 'Браузер не смог включить 3D (WebGL).';
  $('hint').textContent = 'Откройте страницу в Chrome, Edge, Safari или Firefox с включённым аппаратным ускорением.';
  return;
}
R.setPixelRatio(SHOT ? 1 : Math.min(window.devicePixelRatio || 1, 2));
R.setSize(vw(), vh());
R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 0.82;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.shadowMap.autoUpdate = false;
$('stage').appendChild(R.domElement);
const S = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(60, vw()/vh(), 0.05, 400);

// ---------- textures
let seed = 11; const rnd = () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; };
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function rep(t,rx,ry){const c=t.clone();c.needsUpdate=true;c.wrapS=c.wrapT=THREE.RepeatWrapping;c.repeat.set(rx,ry);return c;}
function lam(g,w,h){const rows=12,rh=h/rows;for(let i=0;i<rows;i++){const off=(i*197)%512;
  for(let x=-off;x<w;x+=512){g.fillStyle=`hsl(${32+rnd()*5},${32+rnd()*10}%,${73+rnd()*7}%)`;g.fillRect(x,i*rh,512,rh);
    for(let k=0;k<14;k++){g.strokeStyle=`rgba(120,85,50,${0.04+rnd()*0.06})`;g.lineWidth=1+rnd()*1.5;const y=i*rh+rnd()*rh;
      g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+170,y+(rnd()-.5)*8,x+340,y+(rnd()-.5)*8,x+512,y+(rnd()-.5)*6);g.stroke();}
    g.fillStyle='rgba(110,80,50,.35)';g.fillRect(x,i*rh,2,rh);}
  g.fillStyle='rgba(110,80,50,.3)';g.fillRect(0,i*rh,w,2);}}
function tileDraw(base,grout){return (g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<3000;i++){g.fillStyle=`rgba(${rnd()<.5?255:140},${rnd()<.5?255:140},150,.05)`;g.fillRect(rnd()*w,rnd()*h,2,2);}
  g.fillStyle=grout;g.fillRect(0,0,w,3);g.fillRect(0,0,3,h);};}
function marbleDraw(g,w,h){g.fillStyle='#f1f0ed';g.fillRect(0,0,w,h);
  for(let i=0;i<10;i++){const gr=g.createRadialGradient(rnd()*w,rnd()*h,0,rnd()*w,rnd()*h,200+rnd()*250);gr.addColorStop(0,'rgba(150,150,155,.10)');gr.addColorStop(1,'rgba(150,150,155,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);}
  for(let k=0;k<26;k++){let x=rnd()*w*1.2-w*.1,y=rnd()<.5?-10:rnd()*h;const a=0.12+rnd()*0.45;g.strokeStyle=`rgba(${85+rnd()*40},${85+rnd()*40},${95+rnd()*40},${a})`;
    g.lineWidth=0.6+rnd()*(k<6?6:2.2);g.shadowColor='rgba(90,90,100,.5)';g.shadowBlur=k<6?8:2;g.beginPath();g.moveTo(x,y);
    for(let s=0;s<14;s++){x+=25+rnd()*55;y+=(rnd()-.35)*70;g.lineTo(x,y);}g.stroke();}g.shadowBlur=0;}
function skyDraw(g,w,h){const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#9fc1dc');gr.addColorStop(0.46,'#dce9f1');gr.addColorStop(0.5,'#eef2f1');gr.addColorStop(0.52,'#c9cdbf');gr.addColorStop(1,'#a9ad98');g.fillStyle=gr;g.fillRect(0,0,w,h);}
const lamT=tex(1024,1024,lam), floorTileT=tex(512,512,tileDraw('#e4e4e0','#c8c7c2')), wallTileT=tex(256,512,tileDraw('#eef0ef','#d0d4d3'));
const marbleT=tex(1024,512,marbleDraw);

// ---------- materials
const M=(c,r=0.8,m=0,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},x));
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),CUT);
const mat={
  wall:M('#e8e2d8',0.95), ceil:M('#f7f5f1',0.95), capOld:M('#2e2c29',0.9), capNew:M('#b5562f',0.85),
  pvc:M('#f6f6f4',0.35), glass:new THREE.MeshStandardMaterial({color:'#d6e6ee',roughness:0.05,metalness:0.1,transparent:true,opacity:0.2,depthWrite:false,side:THREE.DoubleSide}),
  graph:M('#2b2b2e',0.55), plinth:M('#1d1d1f',0.8), black:M('#161616',0.35,0.3), chrome:M('#d4d7da',0.2,0.9), steel:M('#b4b8bb',0.3,0.75),
  upper:M('#ebe6dc',0.45), upperC:M('#d8d2c6',0.6), panel:M('#3b3b3f',0.6), appl:M('#efefec',0.35), fridge:M('#f1f1ee',0.3),
  woodL:M('#d8bb92',0.55), wood:M('#c49a68',0.6), oak:M('#b88a5a',0.6),
  sofa:M('#9fb0bd',0.95), sofaD:M('#8a9cab',0.95), rug:M('#e2d8c7',1), linen:M('#ece5d9',0.95,0,{side:THREE.DoubleSide}),
  bedBase:M('#cbb698',0.9), sheet:M('#f5f3ef',0.95), duvet:M('#dccfba',0.95), head:M('#6e5b49',0.9), throwM:M('#b8714f',0.95),
  ward:M('#efe9df',0.5), wardC:M('#e1dacd',0.6), ceramic:M('#fbfbfa',0.12), seat:M('#d9c7ab',0.9), back:M('#a88d6a',0.85),
  tv:M('#0c0d0f',0.25,0.2), tvStand:M('#46403a',0.6), door:M('#f3f0ea',0.45), doorEnt:M('#5a534c',0.5),
  green:M('#5f7f4f',0.8), greenD:M('#486a3c',0.8), pot:M('#cfc6b8',0.7), hobGlass:M('#121212',0.1,0.3),
  led:M('#ffffff',0.5,0,{emissive:'#fff1d6',emissiveIntensity:1}), shade:M('#f3ead8',0.8,0,{emissive:'#ffe1ad',emissiveIntensity:0.55,side:THREE.DoubleSide}),
  bulb:M('#ffffff',0.4,0,{emissive:'#fff2d8',emissiveIntensity:1.2}), mirror:M('#d3dde1',0.06,0.15),
  wallTile:new THREE.MeshStandardMaterial({color:'#ffffff',roughness:0.25}),
  back1:new THREE.MeshStandardMaterial({map:rep(marbleT,1.05,0.56),roughness:0.22}), back2:new THREE.MeshStandardMaterial({map:rep(marbleT,0.3,0.56),roughness:0.22}),
  ctop:new THREE.MeshStandardMaterial({map:rep(marbleT,1.05,0.31),roughness:0.3}),
};
['wall','pvc','glass','linen','door','doorEnt','mirror','back1','back2'].forEach(k=>mat[k].clippingPlanes=[clip]);

// ---------- builders
const obst=[]; // walkable-area obstacles as polygons [[x,z],...]
const groups={ceil:new THREE.Group(),capTop:new THREE.Group(),capCut:new THREE.Group(),outdoor:new THREE.Group(),hung:new THREE.Group()};
Object.values(groups).forEach(g=>S.add(g));
function block(x1,x2,z1,z2){obst.push([[x1,z1],[x2,z1],[x2,z2],[x1,z2]]);}
function blockSeg(ax,az,bx,bz,h){const dx=bx-ax,dz=bz-az,L=Math.hypot(dx,dz),nx=-dz/L*h,nz=dx/L*h;obst.push([[ax+nx,az+nz],[bx+nx,bz+nz],[bx-nx,bz-nz],[ax-nx,az-nz]]);}
function blockCircle(cx,cz,r){const p=[];for(let i=0;i<10;i++){const a=i/10*Math.PI*2;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r]);}obst.push(p);}
function box(x1,x2,y1,y2,z1,z2,m,o={}){
  const me=new THREE.Mesh(new THREE.BoxGeometry(Math.max(Math.abs(x2-x1),1e-4),Math.max(Math.abs(y2-y1),1e-4),Math.max(Math.abs(z2-z1),1e-4)),m);
  me.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);me.castShadow=o.cast!==false;me.receiveShadow=true;(o.p||S).add(me);
  if(o.block)block(Math.min(x1,x2),Math.max(x1,x2),Math.min(z1,z2),Math.max(z1,z2));return me;}
function seg(ax,az,bx,bz,th,y1,y2,m,o={}){
  const dx=bx-ax,dz=bz-az,L=Math.hypot(dx,dz);const me=new THREE.Mesh(new THREE.BoxGeometry(L,y2-y1,th),m);
  me.position.set((ax+bx)/2,(y1+y2)/2,(az+bz)/2);me.rotation.y=-Math.atan2(dz,dx);me.castShadow=o.cast!==false;me.receiveShadow=true;(o.p||S).add(me);
  if(o.block)blockSeg(ax,az,bx,bz,th/2);return me;}
function cyl(x,y,z,r,h,m,o={}){
  const me=new THREE.Mesh(new THREE.CylinderGeometry(o.rt!==undefined?o.rt:r,r,h,o.seg||32,1,!!o.open),m);
  me.position.set(x,y,z);if(o.rx)me.rotation.x=o.rx;if(o.rz)me.rotation.z=o.rz;if(o.sz)me.scale.z=o.sz;if(o.sx)me.scale.x=o.sx;
  me.castShadow=o.cast!==false;me.receiveShadow=true;(o.p||S).add(me);return me;}
const unitS=new THREE.SphereGeometry(1,24,16);
function sph(x,y,z,sx,sy,sz,m,o={}){const me=new THREE.Mesh(unitS,m);me.position.set(x,y,z);me.scale.set(sx,sy,sz);me.castShadow=o.cast!==false;me.receiveShadow=true;(o.p||S).add(me);return me;}
function plane(x1,x2,z1,z2,y,m,o={}){const me=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),m);me.rotation.x=-Math.PI/2;me.position.set((x1+x2)/2,y,(z1+z2)/2);me.receiveShadow=true;(o.p||S).add(me);return me;}
function slabPoly(pts,y1,y2,m){const sh=new THREE.Shape();pts.forEach(([x,z],i)=>i?sh.lineTo(x,-z):sh.moveTo(x,-z));
  const g=new THREE.ExtrudeGeometry(sh,{depth:y2-y1,bevelEnabled:false});g.rotateX(-Math.PI/2);const me=new THREE.Mesh(g,m);me.position.y=y1;me.castShadow=me.receiveShadow=true;S.add(me);return me;}
// walls: body + dark plan-colour caps (on top for the full model, at the cut for the sectioned one)
function caps(make,y1,y2,isNew){const cm=isNew?mat.capNew:mat.capOld;
  if(y2>=CEIL-1e-3)make(CEIL,CEIL+0.012,cm,groups.capTop);
  if(y1<CUT&&y2>CUT)make(CUT-0.012,CUT,cm,groups.capCut);}
function wall(x1,x2,z1,z2,y1,y2,isNew){box(x1,x2,y1,y2,z1,z2,mat.wall,{block:y1<0.01});
  caps((a,b,cm,p)=>box(x1-0.001,x2+0.001,a,b,z1-0.001,z2+0.001,cm,{p,cast:false}),y1,y2,isNew);}
function wallSeg(ax,az,bx,bz,th,y1,y2,isNew){seg(ax,az,bx,bz,th,y1,y2,mat.wall,{block:y1<0.01});
  caps((a,b,cm,p)=>seg(ax,az,bx,bz,th+0.002,a,b,cm,{p,cast:false}),y1,y2,isNew);}

// ---------- floors
plane(0,6.58,0,5.5,0,new THREE.MeshStandardMaterial({map:rep(lamT,6.58/2.4,5.5/2.4),roughness:0.55}));
plane(0.6,1.62,5.5,5.75,0,mat.wall);
const tileM=(w,d)=>new THREE.MeshStandardMaterial({map:rep(floorTileT,w/0.3,d/0.3),roughness:0.3});
plane(1.62,4.365,4.375,5.5,0.002,tileM(2.745,1.125));
plane(4.365,6.58,3.565,5.5,0.002,tileM(2.215,1.935));

// ---------- shell
wall(-0.2,0,-0.4,5.75,0,CEIL,false); wall(6.58,6.78,-0.4,5.75,0,CEIL,false);
wall(-0.2,0.6,5.5,5.75,0,CEIL,false); wall(1.62,6.78,5.5,5.75,0,CEIL,false); wall(0.6,1.62,5.5,5.75,2.1,CEIL,false);
wall(-0.2,1.2,-0.4,0,0,CEIL,false); wall(1.2,2.0,-0.4,0,2.2,CEIL,false);
wall(2.0,2.8,-0.4,0,0,0.85,false); wall(2.0,2.8,-0.4,0,2.2,CEIL,false);
wall(2.8,4.33,-0.4,0,0,CEIL,false);
wall(4.33,5.93,-0.4,0,0,0.85,false); wall(4.33,5.93,-0.4,0,2.2,CEIL,false);
wall(5.93,6.78,-0.4,0,0,CEIL,false);
block(-0.2,6.78,-0.4,0); block(-0.2,6.78,5.5,5.75);
// new partitions (orange caps) and existing bathroom walls
wall(3.48,3.58,0,2.735,0,CEIL,true);
wallSeg(3.495,2.65,3.647,2.802,0.1,0,CEIL,true);
wallSeg(4.213,3.368,4.365,3.52,0.1,0,CEIL,true);
wallSeg(3.647,2.802,4.213,3.368,0.1,2.05,CEIL,true);
wall(4.28,4.365,3.435,3.535,0,CEIL,true);
wall(4.365,6.58,3.435,3.565,0,CEIL,false);
wall(4.365,4.495,4.375,5.5,0,CEIL,false);
wall(4.365,4.495,3.565,4.375,2.05,CEIL,false);
// ceiling (casts the shadow that keeps daylight to the windows)
box(-0.2,6.78,CEIL,CEIL+0.1,-0.4,5.75,mat.ceil,{p:groups.ceil});

// ---------- windows and balcony
function win(x1,x2,y1,y2,o={}){const z1=-0.14,z2=-0.07,f=0.065;
  box(x1,x2,y1,y1+f,z1,z2,mat.pvc);box(x1,x2,y2-f,y2,z1,z2,mat.pvc);box(x1,x1+f,y1,y2,z1,z2,mat.pvc);box(x2-f,x2,y1,y2,z1,z2,mat.pvc);
  (o.mull||[]).forEach(xm=>box(xm-0.035,xm+0.035,y1,y2,z1,z2,mat.pvc));

function inPoly(x,z,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,zi]=p[i],[xj,zj]=p[j];if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))c=!c;}return c;}
function dSeg(x,z,a,b){const dx=b[0]-a[0],dz=b[1]-a[1],t=clamp(((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz||1),0,1);return Math.hypot(x-a[0]-t*dx,z-a[1]-t*dz);}
function blocked(x,z){if(x<PR||x>6.58-PR||z<PR||z>5.5-PR)return true;
  for(const k in doors){const d=doors[k],a=doorAngle(d);if(dSeg(x,z,[d.hx,d.hz],[d.hx+Math.cos(a)*d.len,d.hz+Math.sin(a)*d.len])<PR+0.02)return true;}
  for(const p of obst){if(inPoly(x,z,p))return true;for(let i=0;i<p.length;i++)if(dSeg(x,z,p[i],p[(i+1)%p.length])<PR)return true;}return false;}
function tryMove(dx,dz){let ok=false;if(!blocked(st.pos.x+dx,st.pos.z)){st.pos.x+=dx;ok=true;}if(!blocked(st.pos.x,st.pos.z+dz)){st.pos.z+=dz;ok=true;}return ok;}

  if(x<0||x>6.58||z<0||z>5.5)return;
  if(st.mode==='over'){if(h.point.y>0.06||blocked(x,z)){flash('Здесь не встать: выберите свободный участок пола');return;}enterWalkAt(x,z,-st.o.theta);}
  else{let tx=x,tz=z;if(h.point.y>0.06){const dx=x-st.pos.x,dz=z-st.pos.z,d=Math.hypot(dx,dz);if(d<0.35)return;tx=x-dx/d*0.3;tz=z-dz/d*0.3;}st.target={x:tx,z:tz,stuck:0};}
  dirty=true;}
let flashT=0;function flash(t){const h=$('hint'),old=h.textContent;h.textContent=t;clearTimeout(flashT);flashT=setTimeout(applyVisuals,2200);}
function panBy(dx,dy){const o=st.o,s=o.dist*0.0016,c=Math.cos(o.theta),sn=Math.sin(o.theta);o.tx=clamp(o.tx-(c*dx-sn*dy)*s,-1,8);o.tz=clamp(o.tz-(-sn*dx-c*dy)*s,-2,7);}
el.addEventListener('pointerdown',e=>{el.focus({preventScroll:true});try{el.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});anim=null;
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now(),btn:e.button,moved:false,pan:e.button===2||e.shiftKey};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};if(drag)drag.moved=true;}});
el.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size>=2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(st.mode==='over'){st.o.dist=clamp(st.o.dist*pinch.d/Math.max(d,1),3,28);panBy(mx-pinch.mx,my-pinch.my);}
    else{const f=(d-pinch.d)*0.006;tryMove(Math.sin(st.yaw)*f,-Math.cos(st.yaw)*f);}
    pinch={d,mx,my};dirty=true;return;}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>5)drag.moved=true;if(!drag.moved)return;
  if(st.mode==='over'){if(drag.pan)panBy(dx,dy);else{st.o.theta-=dx*0.008;st.o.phi=clamp(st.o.phi-dy*0.006,0.02,1.42);}}
  else{st.yaw-=dx*0.0045;st.pitch=clamp(st.pitch+dy*0.0045,-1.25,1.25);st.target=null;}
  st.current='';document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-current',false));dirty=true;});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===1){pinch=null;const [a]=[...ptrs.values()];drag={x:a.x,y:a.y,x0:a.x,y0:a.y,t:0,btn:-1,moved:true,pan:false};return;}
  if(ptrs.size===0){if(drag&&!drag.moved&&drag.btn===0&&performance.now()-drag.t<600)onTap(e.clientX,e.clientY);drag=null;pinch=null;}}
el.addEventListener('pointerup',endPtr);el.addEventListener('pointercancel',endPtr);
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('wheel',e=>{e.preventDefault();anim=null;
  if(st.mode==='over')st.o.dist=clamp(st.o.dist*Math.exp(e.deltaY*0.0012),3,28);
  else{const f=clamp(-e.deltaY*0.0025,-0.4,0.4);tryMove(Math.sin(st.yaw)*f,-Math.cos(st.yaw)*f);}dirty=true;},{passive:false});
const KEYS={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',KeyD:'r',ArrowLeft:'tl',KeyQ:'tl',ArrowRight:'tr',KeyE:'tr'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='BUTTON'&&(e.code==='Enter'||e.code==='Space'))return;
  const k=KEYS[e.code];if(e.key==='Shift')st.keys.run=true;if(!k)return;e.preventDefault();anim=null;
  if(st.mode==='over'&&(k==='f'||k==='b'||k==='l'||k==='r')&&/^Key/.test(e.code)){enterWalkAt(st.pos.x,st.pos.z,st.yaw);}
  st.keys[k]=true;dirty=true;});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(e.key==='Shift')st.keys.run=false;if(k)st.keys[k]=false;});
addEventListener('blur',()=>{st.keys={};});
addEventListener('resize',()=>{R.setSize(vw(),vh());if(!anim)placeCamera();if(SHOT){R.shadowMap.needsUpdate=true;R.render(S,cam);placeLabels();}else dirty=true;});

// ---------- UI
CHIPS.forEach(([k,t])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.dataset.v=k;b.id='v-'+k;
  b.addEventListener('click',()=>go(k));$('views').appendChild(b);});
function go(k){if(location.hash.slice(1)===k)setView(k,true);else location.hash=k;}
$('mOver').addEventListener('click',()=>{if(st.mode!=='over')go('obzor');});
$('mWalk').addEventListener('click',()=>{if(st.mode!=='walk')go('vhod');});
$('cutBtn').addEventListener('click',()=>{st.cut=!st.cut;try{localStorage.setItem('cut3d',st.cut?'1':'0');}catch(_){}applyVisuals();});
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(VIEWS[k])setView(k,true);});
try{const c=localStorage.getItem('cut3d');if(c==='0')st.cut=false;}catch(_){}
const mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');if(mq&&mq.addEventListener)mq.addEventListener('change',readBg);
new MutationObserver(readBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ---------- loop
let last=performance.now();
function frame(now){if(!SHOT)requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;
  for(const k in doors){const d=doors[k];if(d.t!==d.goal){const sp=dt/0.6;setDoor(k,d.goal>d.t?Math.min(d.goal,d.t+sp):Math.max(d.goal,d.t-sp));R.shadowMap.needsUpdate=true;dirty=true;}}
  for(const k in flaps){const f=flaps[k];if(f.t!==f.goal){const sp=dt/0.5;setFlap(k,f.goal>f.t?Math.min(f.goal,f.t+sp):Math.max(f.goal,f.t-sp));R.shadowMap.needsUpdate=true;dirty=true;}}
  if(anim){const t=clamp((now-anim.t0)/anim.dur,0,1),e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    cam.position.lerpVectors(anim.fromP,anim.toP,e);cam.quaternion.copy(anim.fromQ).slerp(anim.toQ,e);cam.fov=anim.fromF+(anim.toF-anim.fromF)*e;cam.updateProjectionMatrix();
    if(t>=1){const late=anim.late;anim=null;if(late)applyVisuals();placeCamera();}dirty=true;}
  else if(st.mode==='walk'){const k=st.keys;const f=(k.f?1:0)-(k.b?1:0),s=(k.r?1:0)-(k.l?1:0),tr=(k.tr?1:0)-(k.tl?1:0);
    if(tr){st.yaw+=tr*1.7*dt;dirty=true;}
    if(f||s){const sp=(k.run?2.6:1.35)*dt,sy=Math.sin(st.yaw),cy=Math.cos(st.yaw);let vx=sy*f+cy*s,vz=-cy*f+sy*s;const n=Math.hypot(vx,vz);tryMove(vx/n*sp,vz/n*sp);st.target=null;dirty=true;}
    else if(st.target){const t=st.target,dx=t.x-st.pos.x,dz=t.z-st.pos.z,d=Math.hypot(dx,dz);
      if(d<0.05)st.target=null;else{const sp=Math.min(d,1.4*dt),px=st.pos.x,pz=st.pos.z;tryMove(dx/d*sp,dz/d*sp);
        if(Math.hypot(st.pos.x-px,st.pos.z-pz)<sp*0.3){t.stuck+=dt;if(t.stuck>0.3)st.target=null;}
        const want=Math.atan2(dx,-dz);let dyaw=want-st.yaw;dyaw=Math.atan2(Math.sin(dyaw),Math.cos(dyaw));if(d>0.25)st.yaw+=dyaw*Math.min(1,dt*3.5);}
      dirty=true;}
    if(dirty)placeCamera();}
  else{const k=st.keys;const tr=(k.tr?1:0)-(k.tl?1:0),z=(k.b?1:0)-(k.f?1:0);if(tr||z){st.o.theta-=tr*1.2*dt;st.o.dist=clamp(st.o.dist*Math.exp(z*dt*1.2),3,28);dirty=true;}if(dirty)placeCamera();}
  if(dirty){dirty=false;try{R.render(S,cam);placeLabels();}catch(err){console.warn(err);}}}

// ---------- start
readBg();
let start=location.hash.slice(1);
if(SHOT){start=start.slice(5);const v=VIEWS[start]||VIEWS.obzor;$('cap').innerHTML=v.name+(v.sub?'<small>'+v.sub+'</small>':'');}
if(!VIEWS[start])start='obzor';
if(VIEWS[start].mode==='walk')st.pos={x:VIEWS[start].p[0],z:VIEWS[start].p[1]};
setView(start,false);
if(SHOT){placeCamera();R.shadowMap.needsUpdate=true;R.render(S,cam);placeLabels();document.title='ok';}
else requestAnimationFrame(frame);
})();
</script>

</body>
